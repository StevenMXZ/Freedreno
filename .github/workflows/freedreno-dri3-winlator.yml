name: freedreno DRI3 Winlator (manual)

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Mesa version to build
        required: true
        default: '26.3.0'
        type: choice
        options:
          - '26.3.0'
          - '27.0.0'
      revision:
        description: Driver revision number (e.g. 2 for R2)
        required: true
        default: '2'
        type: string

permissions:
  contents: write

env:
  NDK_VERSION: android-ndk-r27
  API_LEVEL: '26'
  ROOT: /home/runner/mesa-android

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Validate revision
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          if [[ ! "$REVISION" =~ ^[1-9][0-9]*$ ]]; then
            echo "Revision must be a positive integer" >&2
            exit 1
          fi

      - name: Check out selected Mesa ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          path: mesa
          fetch-depth: 1

      - name: Check out CI helper
        uses: actions/checkout@v4
        with:
          ref: main
          path: helper
          sparse-checkout: ci
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bison flex pkg-config patchelf zstd unzip curl binutils cmake \
            python3-pip dpkg-dev
          pip3 install --break-system-packages --upgrade meson ninja mako pyyaml

      - name: Cache NDK and Termux sysroot
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ROOT }}/ndk
            ${{ env.ROOT }}/dl
            ${{ env.ROOT }}/sysroot
          key: freedreno-dri3-${{ env.NDK_VERSION }}-api${{ env.API_LEVEL }}-termux-v2

      - name: Test KGSL deadlines and Winlator Present events
        run: |
          for test in test_kgsl_wait test_dri3_idle; do
            if [ -f "mesa/ci/$test.c" ]; then
              cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined \
                "mesa/ci/$test.c" -o "$RUNNER_TEMP/$test"
              "$RUNNER_TEMP/$test"
            fi
          done

      - name: Build Winlator DRI3 driver
        run: bash helper/ci/build-freedreno-dri3-winlator.sh "$GITHUB_WORKSPACE/mesa"

      - name: Read build revision
        id: package
        run: |
          sha=$(cat mesa/.freedreno-dri3-build-sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "full_sha=$(git -C mesa rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(cat mesa/VERSION)" >> "$GITHUB_OUTPUT"

      - name: Package minimal importable OpenGL driver
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          python3 -m unittest discover -s helper/ci -p test_package_freedreno.py
          python3 helper/ci/package-freedreno.py mesa/out/usr/lib \
            "mesa/Freedreno-DRI3-${{ steps.package.outputs.sha }}.zip" \
            --version "${{ github.run_number }}.${{ github.run_attempt }}" \
            --revision "$REVISION"

      - name: Upload importable driver
        uses: actions/upload-artifact@v4
        with:
          name: freedreno-dri3-${{ steps.package.outputs.sha }}
          path: mesa/Freedreno-DRI3-${{ steps.package.outputs.sha }}.zip
          if-no-files-found: error

      - name: Publish driver release
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ inputs.revision }}
        run: |
          gh release create "freedreno-dri3-${{ steps.package.outputs.sha }}-${{ github.run_number }}-${{ github.run_attempt }}" \
            "mesa/Freedreno-DRI3-${{ steps.package.outputs.sha }}.zip" \
            --repo "$GITHUB_REPOSITORY" --target "${{ steps.package.outputs.full_sha }}" \
            --title "Freedreno DRI3 ${{ inputs.source_ref }}-R$REVISION (${{ steps.package.outputs.sha }})" \
            --notes "Mesa ${{ steps.package.outputs.version }} | revision: R$REVISION | source: ${{ inputs.source_ref }} @ ${{ steps.package.outputs.full_sha }}. Import the ZIP through Ludashi Components, then select it under Freedreno OpenGL. Requires a compatible Winlator Bionic runtime."
