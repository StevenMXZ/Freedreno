# Builds the freedreno gallium driver as a standalone xlib-GLX libGL for
# Winlator Bionic, aarch64-android, on a GitHub-hosted ubuntu-24.04 runner.
#
# All of the real work lives in patches/build.sh so the same build can be run
# locally; this file only wires up checkout, cache and artifact upload.
name: freedreno-xlib (Winlator, aarch64-android)

on:
  push:
    branches: [freedreno-xlib-winlator]
    tags: ['freedreno-xlib-v*']
  pull_request:
    branches: [freedreno-xlib-winlator]
  workflow_dispatch:

permissions:
  contents: read

env:
  NDK_VERSION: android-ndk-r27
  API_LEVEL: '26'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out mesa
        uses: actions/checkout@v4

      - name: Install host tools
        run: patches/build.sh deps

      - name: Cache NDK and downloads
        id: cache-dl
        uses: actions/cache@v4
        with:
          path: |
            ~/zinkbuild/ndk
            ~/zinkbuild/dl
          key: ndk-${{ env.NDK_VERSION }}-termux-v1

      - name: Build, package and verify
        id: package
        run: |
          patches/build.sh build
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opengl_freedreno-xlib-aarch64-${{ steps.package.outputs.sha }}
          path: opengl_freedreno.tzst
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/freedreno-xlib-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: opengl_freedreno.tzst
          body: |
            freedreno gallium over KGSL, xlib GLX, for Winlator Bionic,
            aarch64-android (minSdk ${{ env.API_LEVEL }}).

            `opengl_freedreno.tzst` carries a single file,
            `usr/lib/libGL.so.1.5.0`. Inside the container it has to be
            reachable as `libGL.so.1` -- dlopen searches LD_LIBRARY_PATH by
            filename, and the soname alone is not enough.

            Run with `GALLIUM_DRIVER=freedreno`. These have to exist in the
            container or dlopen fails before any Mesa code runs:
            libandroid-sysvshm, libc++_shared, liblog, libsync, libX11,
            libX11-xcb, libxcb, libxcb-dri3, libxcb-present, libxcb-sync,
            libXext, libdrm, libz, libzstd.
